- fields:
  - input_transport_road_human_powered_bicycle_demand
  message:
    "Estimated by Quintel based on national surveys and CSO publications. Total cycling distance is calculated by multiplying the number of inhabitants by: (1) the share of journeys made by bike, (2) the share of people who travelled on the reference day, (3) the average number of journeys per person, and (4) the average journey distance (km)."

- fields:
  - input_industry_steel_scrap_hbi_eaf_share
  message:
    "Derived from Steel Statistical Yearbook 2020 concise version - Tabel 6 (continued): https://www.worldsteel.org/steel-by-topic/statistics/steel-statistical-yearbook.html; year:2020; author: Worldsteel Association"

- fields:
  - input_energy_power_ultra_supercritical_coal_production
  message:
    "Derived from the energy balance (2019). Ireland has a single coal-fired power plant (Moneypoint), a pulverised coal plant; all coal demand is therefore attributed to pulverised coal."

- fields:
  - input_energy_power_supercritical_coal_production
  message:
    "Derived from the energy balance (2019). Ireland has a single coal-fired power plant (Moneypoint), a pulverised coal plant; all coal demand is therefore attributed to pulverised coal."

- fields:
  - input_energy_power_ultra_supercritical_lignite_production
  message:
    "Derived from the energy balance (2019). Ireland has a single coal-fired power plant (Moneypoint), a pulverised coal plant; all coal demand is therefore attributed to pulverised coal."

- fields:
  - input_energy_power_turbine_network_gas_production
  message:
    "Derived from the energy balance (2022). Gas demand for fossil electricity plants is distributed over gas turbines and CCGT plants proportionally to their installed capacities (source: EirGrid & SONI, All Island Generation Capacity Statement Data Workbook). "

- fields:
  - input_energy_power_combined_cycle_network_gas_production
  message:
    "Derived from the energy balance (2022). Gas demand for fossil electricity plants is distributed over gas turbines and CCGT plants proportionally to their installed capacities (source: EirGrid & SONI, All Island Generation Capacity Statement Data Workbook). "

- fields:
  - input_energy_power_engine_diesel_production
  message:
    "Derived from the energy balance (2022)."

- fields:
  - input_energy_power_wind_turbine_inland_production
  message:
    "Derived from the Energy Balance. Installed wind capacity (4,120 MW) is sourced from the EirGrid & SONI Data Workbook. All wind production in the Eurostat Energy Balance is attributed to inland wind."

- fields:
  - energy_power_wind_turbine_inland_full_load_hours
  message:
    "Full load hours are calculated by dividing total wind generation by installed wind capacity (source: EirGrid & SONI All Island Generation Capacity Statement Data Workbook, 2022)."

