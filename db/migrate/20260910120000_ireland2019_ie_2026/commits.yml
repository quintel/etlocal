- fields:
  - present_number_of_buildings
  message:
    "Data is retrieved from the Building Stock Observatory (2023). The number of dwelling equivalents is calculated by dividing the total building surface area by the typical surface area per dwelling. See 'https://github.com/quintel/etdataset-public/tree/master/source_analyses/IE_ireland/2019/buildings/buildings.xlsx'>this file</a> for more information."

