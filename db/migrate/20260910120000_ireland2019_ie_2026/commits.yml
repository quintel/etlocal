- fields:
  - typical_useful_demand_for_space_heating_buildings_future
  message:
    "Supplied from NI dataset"

- fields:
  - number_of_cars
  message:
    "The data orginates from the Eurostat table '<a href ='https://ec.europa.eu/eurostat/databrowser/view/road_eqs_carpda__custom_20632494/default/table'>Passenger cars, by type of motor energy</a>'."

- fields:
  - input_transport_road_human_powered_bicycle_demand
  message:
    "Estimated by Quintel based on national surveys and CSO publications. Total cycling distance is calculated by multiplying the number of inhabitants by: (1) the share of journeys made by bike, (2) the share of people who travelled on the reference day, (3) the average number of journeys per person, and (4) the average journey distance (km). See <a href='https://github.com/quintel/etdataset-public/tree/master/source_analyses/IE_ireland/2019/transport/bicycle kilometers.xlsx'>this file</a> for more information."

- fields:
  - input_energy_power_ultra_supercritical_coal_production
  message:
    "Derived from the Eurostat energy balance (2019). Ireland has a single coal-fired power plant (Moneypoint), a pulverised coal plant; all coal demand is therefore attributed to pulverised coal. See <a href='https://github.com/quintel/etdataset-public/tree/master/source_analyses/IE_ireland/2019/primary_production/electricity.xlsx'>this file</a> for more information."

- fields:
  - input_energy_power_supercritical_coal_production
  message:
    "Derived from the Eurostat energy balance (2019). Ireland has a single coal-fired power plant (Moneypoint), a pulverised coal plant; all coal demand is therefore attributed to pulverised coal. See <a href='https://github.com/quintel/etdataset-public/tree/master/source_analyses/IE_ireland/2019/primary_production/electricity.xlsx'>this file</a> for more information."

- fields:
  - input_energy_power_ultra_supercritical_lignite_production
  message:
    "Derived from the energy balance (2019). Ireland has a single coal-fired power plant (Moneypoint), a pulverised coal plant; all coal demand is therefore attributed to pulverised coal."

- fields:
  - input_energy_power_turbine_network_gas_production
  message:
    "Derived from the Eurostat Energy balance (2019). Gas demand for fossil electricity plants is distributed over gas turbines and CCGT plants proportionally to their installed capacities (source: EirGrid & SONI, All Island Generation Capacity Statement Data Workbook, 2022). See <a href='https://github.com/quintel/etdataset-public/tree/master/source_analyses/IE_ireland/2019/primary_production/electricity.xlsx'>this file</a> for more information."

- fields:
  - input_energy_power_combined_cycle_network_gas_production
  message:
    "Derived from the Eurostat Energy balance (2019). Gas demand for fossil electricity plants is distributed over gas turbines and CCGT plants proportionally to their installed capacities (source: EirGrid & SONI, All Island Generation Capacity Statement Data Workbook, 2022). See <a href='https://github.com/quintel/etdataset-public/tree/master/source_analyses/IE_ireland/2019/primary_production/electricity.xlsx'>this file</a> for more information."

- fields:
  - input_energy_power_engine_diesel_production
  message:
    "The data orginates from the Eurostat <a href='https://ec.europa.eu/eurostat/databrowser/view/nrg_bal_c__custom_22103730/default/table'>Energy balance</a>, 2019, multiplied by its corresponding efficiency."

- fields:
  - input_energy_power_wind_turbine_inland_production
  message:
    "EirGrid & SONI, All Island Generation Capacity Statement Data Workbook, 2022. See <a href='https://github.com/quintel/etdataset-public/tree/master/source_analyses/IE_ireland/2019/primary_production/electricity.xlsx'>this file</a> for more information."

